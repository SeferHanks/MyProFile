            top: 0;

            width: 100%;

        /* Scanline Filter - ปรับ z-index เป็น 0 เพื่อให้อยู่หลังคอนเทนต์ */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
            background-size: 100% 4px;

            z-index: 0;

            box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);

        // Particle & Thick Cyber Lightning Engine
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Neon Particles
        const particles = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.4,
            opacity: Math.random() * 0.6 + 0.2
        }));

        // Lightning State
        let lightning = null;

        function createLightning() {
            const startX = Math.random() * canvas.width;
            const startY = 0;
            const targetX = startX + (Math.random() - 0.5) * 450;
            const targetY = canvas.height;
            
            const points = [{ x: startX, y: startY }];
            let currentX = startX;
            let currentY = startY;

            while (currentY < targetY) {
                const nextY = currentY + Math.random() * 45 + 20;
                const nextX = currentX + (Math.random() - 0.5) * 80;
                points.push({ x: nextX, y: Math.min(nextY, targetY) });
                currentX = nextX;
                currentY = nextY;
            }

            lightning = {
                points: points,
                life: 1.0,
                color: Math.random() > 0.3 ? '#00f3ff' : '#ff0055'
            };
        }

        function scheduleNextLightning() {
            const nextTime = Math.random() * 3000 + 1500;
            setTimeout(() => {
                createLightning();
                scheduleNextLightning();
            }, nextTime);
        }
        scheduleNextLightning();

        function renderEngine() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Neon Particles
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 243, 255, ${p.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00f3ff';
                ctx.fill();
            });

            // 2. Render Thick Cyber Lightning Strike
            if (lightning && lightning.life > 0) {
                ctx.beginPath();
                ctx.moveTo(lightning.points[0].x, lightning.points[0].y);
                for (let i = 1; i < lightning.points.length; i++) {
                    ctx.lineTo(lightning.points[i].x, lightning.points[i].y);
                }
                ctx.strokeStyle = lightning.color;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 25;
                ctx.shadowColor = lightning.color;
                ctx.globalAlpha = lightning.life;
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                lightning.life -= 0.07;
            }

            requestAnimationFrame(renderEngine);
        }
        renderEngine();
